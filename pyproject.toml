[project]
name = "account-health-ml-service"
version = "0.1.0"
description = "Portfolio project: churn prediction (ML clássico) served via FastAPI on AKS, fed by a simplified Azure data lake (ADLS Gen2 + Synapse Serverless)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.9",
    "pyarrow>=17.0",
    "azure-storage-file-datalake>=12.16",
    "kaggle>=1.6",
    "numpy>=2.0",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "azure-data-tables>=12.7.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "py7zr>=1.1.3",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/account_health"]

[tool.pytest.ini_options]
testpaths = ["tests"]
